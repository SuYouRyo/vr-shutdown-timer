name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 自测（不会真正关机）
        run: |
          python tests/test_core.py
          python tests/test_flow.py

      - name: 打包（单文件 + 便携版 + 安装包）
        shell: pwsh
        run: ./build.ps1 -All -Installer -Clean

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: VRShutdownTimer-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            dist/VRShutdownTimer.exe
            dist_installer/VRShutdownTimer-Setup-*.exe
            dist_installer/VRShutdownTimer-Uninstall.exe
